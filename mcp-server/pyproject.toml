[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mqtt-mcp-server"
version = "0.1.0"
description = "Minimal MCP server for the ESP32 MQTT project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=1.12,<2"]

[project.scripts]
mqtt-mcp-server = "mqtt_mcp_server.server:main"

[tool.setuptools.packages.find]
where = ["src"]
