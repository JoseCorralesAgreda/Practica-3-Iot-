[platformio]
default_envs = esp32doit-devkit-v1
src_dir = .
include_dir = include

[env]
platform = espressif32@7.1.1
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200

[env:esp32doit-devkit-v1]
build_src_filter = -<*> +<src/main.cpp> +<src/DistanceSensor.cpp> +<src/LedController.cpp> +<src/MqttClient.cpp>
lib_deps = bblanchon/ArduinoJson@6.21.5

[env:hardware-check]
build_src_filter = -<*> +<checks/hardware.cpp> +<src/DistanceSensor.cpp> +<src/LedController.cpp>

[env:mqtt-check]
build_src_filter = -<*> +<checks/mqtt.cpp> +<src/MqttClient.cpp>
lib_deps = bblanchon/ArduinoJson@6.21.5
