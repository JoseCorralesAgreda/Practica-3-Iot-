[platformio]
default_envs = esp32doit-devkit-v1
src_dir = .
include_dir = include

[env]
platform = espressif32@7.1.1
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200

; Keep the existing diagnostic entry point until MQTT integration is implemented.
[env:esp32doit-devkit-v1]
build_src_filter = -<*> +<src/main.cpp>

[env:hardware-check]
build_src_filter = -<*> +<checks/hardware.cpp> +<src/DistanceSensor.cpp> +<src/LedController.cpp>
